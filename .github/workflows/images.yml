name: Build and publish service images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Checkout platform source
        uses: actions/checkout@v4
        with:
          repository: codearena-platform/codearena-platform
          path: codearena-platform

      - name: Checkout core source
        uses: actions/checkout@v4
        with:
          repository: codearena-platform/codearena-core
          path: codearena-core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gateway image metadata
        id: gateway-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codearena-platform/codearena-gateway
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build gateway image
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codearena-platform/Dockerfile.gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.gateway-meta.outputs.tags }}
          labels: ${{ steps.gateway-meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: IAM image metadata
        id: iam-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codearena-platform/codearena-iam
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build IAM image
        id: iam
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codearena-platform/Dockerfile.iam
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.iam-meta.outputs.tags }}
          labels: ${{ steps.iam-meta.outputs.labels }}
          cache-from: type=gha,scope=iam
          cache-to: type=gha,mode=max,scope=iam

      - name: Competition image metadata
        id: competition-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codearena-platform/codearena-competition
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build competition image
        id: competition
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codearena-platform/Dockerfile.competition
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.competition-meta.outputs.tags }}
          labels: ${{ steps.competition-meta.outputs.labels }}
          cache-from: type=gha,scope=competition
          cache-to: type=gha,mode=max,scope=competition

      - name: Core image metadata
        id: core-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codearena-platform/codearena-core
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build Core image
        id: core
        uses: docker/build-push-action@v6
        with:
          context: codearena-core
          file: codearena-core/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.core-meta.outputs.tags }}
          labels: ${{ steps.core-meta.outputs.labels }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

      - name: Write image digests
        if: github.event_name != 'pull_request'
        run: |
          cat > k8s/images.env <<EOF
          # Generated by .github/workflows/images.yml. Do not edit by hand.
          GATEWAY_IMAGE=ghcr.io/codearena-platform/codearena-gateway@${{ steps.gateway.outputs.digest }}
          IAM_IMAGE=ghcr.io/codearena-platform/codearena-iam@${{ steps.iam.outputs.digest }}
          COMPETITION_IMAGE=ghcr.io/codearena-platform/codearena-competition@${{ steps.competition.outputs.digest }}
          CORE_IMAGE=ghcr.io/codearena-platform/codearena-core@${{ steps.core.outputs.digest }}
          EOF

      # This organization disables "Allow GitHub Actions to create and approve
      # pull requests", so the workflow can only publish the digest branch.
      # A maintainer opens the PR manually from the link in the run summary.
      - name: Publish digest branch for manual PR
        if: github.event_name != 'pull_request'
        env:
          DIGEST_BRANCH: chore/update-image-digests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$DIGEST_BRANCH"
          git add k8s/images.env
          if git diff --cached --quiet; then
            echo "### Image digests are already current" >> "$GITHUB_STEP_SUMMARY"
            echo "No PR is needed: \`k8s/images.env\` already matches the latest build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: update service image digests"
          git push --force origin "$DIGEST_BRANCH"
          {
            echo "### Manual step: open the digest update PR"
            echo
            echo "Actions cannot create PRs in this organization. Open the PR manually:"
            echo
            echo "https://github.com/codearena-platform/codearena-infra/compare/main...${DIGEST_BRANCH}"
            echo
            echo "Suggested title: \`chore: update service image digests\`"
            echo
            echo "Suggested body: Automated update of \`k8s/images.env\` from the latest successful image build."
          } >> "$GITHUB_STEP_SUMMARY"
