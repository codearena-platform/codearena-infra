apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: codearena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iam
  template:
    metadata:
      labels:
        app: iam
    spec:
      serviceAccountName: iam
      automountServiceAccountToken: false
      containers:
        - name: iam
          image: codearena-iam:latest
          # The image tag is not pinned yet; Always avoids running a stale
          # cached image. Replace with an immutable tag/digest once available.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7000
          env:
            # The service reads SERVER_HOST/SERVER_PORT, not HOST/PORT.
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "7000"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: MONGO_URI
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: REDIS_ADDR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: JWT_SECRET
            - name: ENCRYPTER_KEY
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: ENCRYPTER_KEY
            - name: ENABLE_REDIS
              value: "true"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: codearena
spec:
  selector:
    app: iam
  ports:
    - name: http
      protocol: TCP
      port: 7000
      targetPort: http
  type: ClusterIP
