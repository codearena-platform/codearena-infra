# CronJob template for schema migrations. Trigger explicitly for each release
# (see README), or let the monthly schedule act as an idempotent safety net.
# A CronJob is used instead of a static Job so `kubectl apply` never has to
# recreate an immutable, already-completed Job object.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: schema-migrations
  namespace: codearena
spec:
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: migrations
        spec:
          serviceAccountName: migrations
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: migrations
              configMap:
                name: schema-migrations
                defaultMode: 0444
          initContainers:
            - name: postgres-migrations
              image: postgres:16.4-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/migrations/postgres-run.sh"]
              env:
                - name: POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: codearena-secrets
                      key: POSTGRES_DSN
                - name: MIGRATIONS_DIR
                  value: /migrations
              volumeMounts:
                - name: migrations
                  mountPath: /migrations
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
            - name: mongo-migrations
              image: mongo:7.0.14
              imagePullPolicy: IfNotPresent
              command:
                - mongosh
                - --quiet
                - $(MONGO_URI)
                - --file
                - /migrations/mongo-001-indexes.js
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: codearena-secrets
                      key: MONGO_URI
              volumeMounts:
                - name: migrations
                  mountPath: /migrations
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          containers:
            - name: migrations-complete
              # Pinned by digest; this is the same kubectl image used by backup.
              image: bitnami/kubectl@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "echo 'schema migrations complete'"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
