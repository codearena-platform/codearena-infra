apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codearena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      containers:
        - name: gateway
          # Rendered from k8s/images.env as registry/repository@sha256:<digest>.
          image: ${GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: IAM_URL
              value: "http://iam:7000"
            - name: COMPETITION_URL
              value: "http://competition:7001"
            - name: REALTIME_URL
              value: "http://realtime:8081"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codearena
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  # Public exposure is handled by the TLS-terminating gateway Ingress created
  # by Terraform. Keep this Service internal-only.
  type: ClusterIP
