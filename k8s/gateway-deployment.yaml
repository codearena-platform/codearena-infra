apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codearena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: codearena-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: IAM_URL
              value: "http://iam:7000"
            - name: REALTIME_URL
              value: "http://realtime:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codearena
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
