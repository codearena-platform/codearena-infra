apiVersion: apps/v1
kind: Deployment
metadata:
  name: competition
  namespace: codearena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: competition
  template:
    metadata:
      labels:
        app: competition
    spec:
      serviceAccountName: competition
      automountServiceAccountToken: false
      containers:
        - name: competition
          # Rendered from k8s/images.env as registry/repository@sha256:<digest>.
          image: ${COMPETITION_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7001
            - name: grpc
              containerPort: 50052
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: POSTGRES_DSN
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: MONGO_URI
            - name: IAM_URL
              value: "http://iam:7000"
            - name: SIMULATION_URL
              value: "simulation:50051"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: competition
  namespace: codearena
spec:
  selector:
    app: competition
  ports:
    - name: http
      protocol: TCP
      port: 7001
      targetPort: http
    - name: grpc
      protocol: TCP
      port: 50052
      targetPort: grpc
  type: ClusterIP
