# Workloads do not call the Kubernetes API, so their tokens are not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: codearena
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam
  namespace: codearena
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: competition
  namespace: codearena
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simulation
  namespace: codearena
automountServiceAccountToken: false
---
# Schema migrations only use the datastore connection strings injected as env
# vars; they never call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrations
  namespace: codearena
automountServiceAccountToken: false
---
# The backup job reads the credentials Secret through the Kubernetes API, so it
# keeps its token mounted (see rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: codearena
